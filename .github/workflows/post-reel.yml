name: Post Reel

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: post-reel
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run posting script
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCOUNT_ID: ${{ secrets.IG_ACCOUNT_ID }}
          GDRIVE_NOTEXT_FOLDER_ID: ${{ secrets.GDRIVE_NOTEXT_FOLDER_ID }}
          GDRIVE_TEXT_FOLDER_ID: ${{ secrets.GDRIVE_TEXT_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: python instagram_post.py

      - name: Commit updated rotation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update rotation state"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push odbijen, pokusavam ponovo (pokusaj $i)..."
            git pull --rebase origin main
            sleep 5
          done
          git push
